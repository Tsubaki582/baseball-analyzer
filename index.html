<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>野球分析アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ホーム画面 -->
    <div id="homeScreen" class="screen active">
        <div class="screen-content">
            <div class="app-header">
                <h1 class="app-title">野球分析アプリ</h1>
                <p class="app-subtitle">試合データを1球ずつ記録・分析</p>
            </div>

            <div class="home-buttons">
                <button class="btn-primary btn-large" id="btnNewGame">
                    <span class="btn-icon">➕</span>
                    新しい試合を始める
                </button>
                <button class="btn-secondary btn-large" id="btnPastGames">
                    <span class="btn-icon">📊</span>
                    過去の試合
                </button>
                <button class="btn-secondary btn-large" id="btnPlayerManagement">
                    <span class="btn-icon">👥</span>
                    選手管理
                </button>
                <button class="btn-secondary btn-large" id="btnAnalysis">
                    <span class="btn-icon">📈</span>
                    分析
                </button>
            </div>
        </div>
    </div>

    <!-- 試合前設定画面 -->
    <div id="matchSetupScreen" class="screen">
        <div class="screen-header">
            <button class="btn-back" id="backFromSetup">← 戻る</button>
            <h2>試合前設定</h2>
            <div></div>
        </div>

        <div class="screen-content">
            <div class="card">
                <h3>試合情報</h3>
                <div class="form-group">
                    <label>試合日</label>
                    <input type="date" id="matchDate" class="form-input">
                </div>
                <div class="form-group">
                    <label>対戦相手</label>
                    <input type="text" id="opponent" class="form-input" placeholder="大学名など">
                </div>
                <div class="form-group">
                    <label>球場</label>
                    <input type="text" id="stadium" class="form-input" placeholder="野球場名">
                </div>
                <div class="form-group">
                    <label>大会名</label>
                    <input type="text" id="tournament" class="form-input" placeholder="リーグ名など">
                </div>
                <div class="form-group">
                    <label>攻撃順序</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="order" value="home" checked>
                            先攻（自チーム先）
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="order" value="away">
                            後攻（相手先）
                        </label>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-primary" id="proceedToTeamSetup">次へ: チーム設定</button>
            </div>
        </div>
    </div>

    <!-- チーム設定画面 -->
    <div id="teamSetupScreen" class="screen">
        <div class="screen-header">
            <button class="btn-back" id="backFromTeamSetup">← 戻る</button>
            <h2>チーム設定</h2>
            <div></div>
        </div>

        <div class="screen-content">
            <div class="tab-group">
                <button class="tab-button active" data-tab="own-team">自チーム</button>
                <button class="tab-button" data-tab="opponent-team">相手チーム</button>
            </div>

            <!-- 自チーム選手一覧 -->
            <div id="ownTeamTab" class="tab-content active">
                <div class="card">
                    <div class="team-name-section">
                        <h3>自チーム名</h3>
                        <input type="text" id="ownTeamName" class="form-input" placeholder="チーム名を入力">
                    </div>
                </div>

                <div class="card">
                    <h3>スタメン設定 (9人)</h3>
                    <div id="ownTeamLineup" class="lineup-list"></div>
                    <button class="btn-secondary" id="addOwnPlayer">+ 選手を追加</button>
                </div>

                <div class="card">
                    <h3>控え選手</h3>
                    <div id="ownTeamBench" class="bench-list"></div>
                    <button class="btn-secondary" id="addOwnBench">+ 控え選手を追加</button>
                </div>
            </div>

            <!-- 相手チーム選手一覧 -->
            <div id="opponentTeamTab" class="tab-content">
                <div class="card">
                    <div class="team-name-section">
                        <h3>相手チーム名</h3>
                        <input type="text" id="opponentTeamName" class="form-input" placeholder="チーム名を入力">
                    </div>
                </div>

                <div class="card">
                    <h3>スタメン設定 (9人)</h3>
                    <div id="opponentTeamLineup" class="lineup-list"></div>
                    <button class="btn-secondary" id="addOpponentPlayer">+ 選手を追加</button>
                </div>

                <div class="card">
                    <h3>控え選手</h3>
                    <div id="opponentTeamBench" class="bench-list"></div>
                    <button class="btn-secondary" id="addOpponentBench">+ 控え選手を追加</button>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-primary" id="startMatch">試合を開始する</button>
            </div>
        </div>
    </div>

    <!-- 選手追加モーダル -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="playerModalTitle">選手を追加</h3>
                <button class="btn-close" id="closePlayerModal">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>背番号</label>
                    <input type="number" id="playerNumber" class="form-input" min="1" max="99">
                </div>
                <div class="form-group">
                    <label>選手名</label>
                    <input type="text" id="playerName" class="form-input" placeholder="名前を入力">
                </div>
                <div class="form-group">
                    <label>打法</label>
                    <select id="playerBatting" class="form-input">
                        <option value="">選択してください</option>
                        <option value="right">右打ち</option>
                        <option value="left">左打ち</option>
                        <option value="switch">両打ち</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>投法</label>
                    <select id="playerThrow" class="form-input">
                        <option value="">選択してください</option>
                        <option value="right">右投げ</option>
                        <option value="left">左投げ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>守備位置</label>
                    <select id="playerPosition" class="form-input">
                        <option value="">選択してください</option>
                        <option value="P">投手</option>
                        <option value="C">捕手</option>
                        <option value="1B">一塁手</option>
                        <option value="2B">二塁手</option>
                        <option value="3B">三塁手</option>
                        <option value="SS">遊撃手</option>
                        <option value="LF">左翼手</option>
                        <option value="CF">中堅手</option>
                        <option value="RF">右翼手</option>
                        <option value="DH">DH</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelPlayerModal">キャンセル</button>
                <button class="btn-primary" id="savePlayer">保存</button>
            </div>
        </div>
    </div>

    <!-- モーダルオーバーレイ -->
    <div id="modalOverlay" class="modal-overlay"></div>

    <!-- スクリプト読み込み -->
    <script src="uiState.js"></script>
    <script src="app.js"></script>
</body>
</html>
